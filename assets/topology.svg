<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F9E82" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F9E82" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F9E82" stop-opacity="0"/>
      <stop offset="40%" stop-color="#1F9E82" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8A96AC" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- faint grid -->
  <g stroke="#F5F3ED" stroke-opacity="0.06">
    <path d="M40 40 H600 M40 100 H600 M40 160 H600 M40 220 H600 M40 280 H600 M40 340 H600 M40 400 H600 M40 460 H600"/>
    <path d="M40 40 V480 M100 40 V480 M160 40 V480 M220 40 V480 M280 40 V480 M340 40 V480 M400 40 V480 M460 40 V480 M520 40 V480 M580 40 V480"/>
  </g>

  <!-- links -->
  <g stroke="url(#lineGrad)" stroke-width="1.5">
    <path d="M160 120 L320 200"/>
    <path d="M480 120 L320 200"/>
    <path d="M320 200 L180 320"/>
    <path d="M320 200 L460 320"/>
    <path d="M180 320 L320 420"/>
    <path d="M460 320 L320 420"/>
    <path d="M320 200 L320 320" stroke-dasharray="4 6"/>
  </g>

  <!-- pulse dots along paths -->
  <circle class="pulse" cx="240" cy="160" r="3" fill="#1F9E82"/>
  <circle class="pulse delay" cx="400" cy="160" r="3" fill="#1F9E82"/>
  <circle class="pulse delay2" cx="250" cy="260" r="3" fill="#1F9E82"/>

  <!-- nodes -->
  <g>
    <rect x="100" y="88" width="120" height="56" rx="2" fill="url(#nodeFill)" stroke="#1F9E82" stroke-opacity="0.55"/>
    <text x="160" y="115" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">API Gateway</text>
    <text x="160" y="132" text-anchor="middle" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="9">APIGEE</text>

    <rect x="420" y="88" width="120" height="56" rx="2" fill="url(#nodeFill)" stroke="#1F9E82" stroke-opacity="0.55"/>
    <text x="480" y="115" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Cloud</text>
    <text x="480" y="132" text-anchor="middle" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="9">AWS · Azure</text>

    <rect x="250" y="172" width="140" height="56" rx="2" fill="#1B242F" stroke="#1F9E82" stroke-opacity="0.9"/>
    <text x="320" y="199" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Orchestration</text>
    <text x="320" y="216" text-anchor="middle" fill="#1F9E82" font-family="IBM Plex Mono, monospace" font-size="9">Microservices</text>

    <rect x="110" y="292" width="140" height="56" rx="2" fill="url(#nodeFill)" stroke="#8A96AC" stroke-opacity="0.45"/>
    <text x="180" y="319" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Kubernetes</text>
    <text x="180" y="336" text-anchor="middle" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="9">AKS · EKS · Helm</text>

    <rect x="390" y="292" width="140" height="56" rx="2" fill="url(#nodeFill)" stroke="#8A96AC" stroke-opacity="0.45"/>
    <text x="460" y="319" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Data Plane</text>
    <text x="460" y="336" text-anchor="middle" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="9">Kafka · Postgres</text>

    <rect x="250" y="392" width="140" height="56" rx="2" fill="url(#nodeFill)" stroke="#1F9E82" stroke-opacity="0.55"/>
    <text x="320" y="419" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Observability</text>
    <text x="320" y="436" text-anchor="middle" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="9">Splunk · Dynatrace</text>
  </g>
</svg>
