<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img" aria-labelledby="topoTitle topoDesc">
  <title id="topoTitle">How Telstra orders flow through ODO</title>
  <desc id="topoDesc">A Telstra customer order is decomposed and orchestrated by the Java Spring Boot ODO platform, stored in PostgreSQL and streamed on Kafka, then run on Kubernetes. The platform moved from AWS EKS with Graviton to Azure AKS, with Elastic, Veracode, and production support in Australia and Mexico.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A36"/>
      <stop offset="100%" stop-color="#151C24"/>
    </linearGradient>
    <linearGradient id="odoCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3A34"/>
      <stop offset="100%" stop-color="#12241F"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#1F9E82"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#10161D"/>

  <text x="36" y="36" fill="#1F9E82" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.8">ORDER JOURNEY</text>
  <text x="36" y="62" fill="#F5F3ED" font-family="Space Grotesk, IBM Plex Sans, sans-serif" font-size="22" font-weight="600">Telstra order in → fulfilled work out</text>
  <text x="924" y="44" text-anchor="end" fill="#8A96AC" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">Amdocs · ODO · 2017–present</text>
  <text x="924" y="64" text-anchor="end" fill="#8A96AC" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">High-volume telecom orders</text>

  <!-- numbered flow -->
  <g font-family="IBM Plex Sans, sans-serif">
    <!-- 1 -->
    <rect x="28" y="92" width="168" height="248" rx="6" fill="url(#card)" stroke="#8A96AC" stroke-opacity="0.28"/>
    <circle cx="52" cy="118" r="12" fill="#1F9E82"/>
    <text x="52" y="122" text-anchor="middle" fill="#10161D" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600">1</text>
    <text x="72" y="124" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">CAPTURE</text>
    <text x="44" y="158" fill="#F5F3ED" font-size="14" font-weight="600">Telstra order</text>
    <text x="44" y="180" fill="#C8D0DA" font-size="12">Customer request for</text>
    <text x="44" y="198" fill="#C8D0DA" font-size="12">mobile, broadband or</text>
    <text x="44" y="216" fill="#C8D0DA" font-size="12">activation lands here.</text>
    <text x="44" y="250" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">Client: Telstra AU</text>
    <text x="44" y="268" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">One commercial order</text>
    <text x="44" y="310" fill="#1F9E82" font-family="IBM Plex Mono, monospace" font-size="10">what comes in</text>

    <path d="M196 216 H222" stroke="#1F9E82" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 2 ODO -->
    <rect x="222" y="92" width="248" height="248" rx="6" fill="url(#odoCard)" stroke="#1F9E82" stroke-opacity="0.7"/>
    <circle cx="246" cy="118" r="12" fill="#1F9E82"/>
    <text x="246" y="122" text-anchor="middle" fill="#10161D" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600">2</text>
    <text x="266" y="124" fill="#1F9E82" font-family="IBM Plex Mono, monospace" font-size="10">DECOMPOSE + ORCHESTRATE</text>
    <text x="238" y="158" fill="#F5F3ED" font-size="16" font-weight="600">ODO platform</text>
    <text x="238" y="180" fill="#C8D0DA" font-size="12">Splits that order into</text>
    <text x="238" y="198" fill="#C8D0DA" font-size="12">fulfillment steps and</text>
    <text x="238" y="216" fill="#C8D0DA" font-size="12">coordinates each step.</text>
    <rect x="238" y="232" width="216" height="68" rx="3" fill="#10161D" stroke="#1F9E82" stroke-opacity="0.45"/>
    <text x="250" y="254" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Java · Spring Boot</text>
    <text x="250" y="272" fill="#C8D0DA" font-family="IBM Plex Mono, monospace" font-size="11">REST APIs · Spring JPA · EhCache</text>
    <text x="250" y="288" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">one service stack, not extras</text>
    <text x="238" y="320" fill="#1F9E82" font-family="IBM Plex Mono, monospace" font-size="10">what ODO does</text>

    <path d="M470 216 H496" stroke="#1F9E82" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 3 data -->
    <rect x="496" y="92" width="200" height="248" rx="6" fill="url(#card)" stroke="#8A96AC" stroke-opacity="0.28"/>
    <circle cx="520" cy="118" r="12" fill="#1F9E82"/>
    <text x="520" y="122" text-anchor="middle" fill="#10161D" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600">3</text>
    <text x="540" y="124" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">REMEMBER + SIGNAL</text>
    <text x="512" y="158" fill="#F5F3ED" font-size="14" font-weight="600">State &amp; events</text>
    <text x="512" y="180" fill="#C8D0DA" font-size="12">Order state is stored.</text>
    <text x="512" y="198" fill="#C8D0DA" font-size="12">Downstream steps are</text>
    <text x="512" y="216" fill="#C8D0DA" font-size="12">signalled asynchronously.</text>
    <rect x="512" y="236" width="168" height="32" rx="2" fill="#1B242F" stroke="#8A96AC" stroke-opacity="0.3"/>
    <text x="596" y="256" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">PostgreSQL · MySQL</text>
    <rect x="512" y="276" width="168" height="32" rx="2" fill="#1B242F" stroke="#8A96AC" stroke-opacity="0.3"/>
    <text x="596" y="296" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Kafka events</text>
    <text x="512" y="328" fill="#1F9E82" font-family="IBM Plex Mono, monospace" font-size="10">how work is kept</text>

    <path d="M696 216 H722" stroke="#1F9E82" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 4 runtime -->
    <rect x="722" y="92" width="210" height="248" rx="6" fill="url(#card)" stroke="#8A96AC" stroke-opacity="0.28"/>
    <circle cx="746" cy="118" r="12" fill="#1F9E82"/>
    <text x="746" y="122" text-anchor="middle" fill="#10161D" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600">4</text>
    <text x="766" y="124" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">RUN</text>
    <text x="738" y="158" fill="#F5F3ED" font-size="14" font-weight="600">Cloud-native runtime</text>
    <text x="738" y="180" fill="#C8D0DA" font-size="12">Left WebLogic monoliths.</text>
    <text x="738" y="198" fill="#C8D0DA" font-size="12">Now Docker + Helm on K8s.</text>
    <rect x="738" y="216" width="178" height="40" rx="2" fill="#1B242F" stroke="#8A96AC" stroke-opacity="0.35"/>
    <text x="827" y="234" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">AWS EKS · Graviton</text>
    <text x="827" y="248" text-anchor="middle" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="9">−40% infrastructure cost</text>
    <text x="827" y="268" text-anchor="middle" fill="#1F9E82" font-size="16">↓</text>
    <rect x="738" y="276" width="178" height="40" rx="2" fill="#10161D" stroke="#1F9E82"/>
    <text x="827" y="294" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Azure AKS</text>
    <text x="827" y="308" text-anchor="middle" fill="#1F9E82" font-family="IBM Plex Mono, monospace" font-size="9">live cloud migration</text>
    <text x="738" y="328" fill="#1F9E82" font-family="IBM Plex Mono, monospace" font-size="10">where it runs</text>
  </g>

  <!-- operate bar -->
  <rect x="28" y="364" width="904" height="140" rx="6" fill="url(#card)" stroke="#8A96AC" stroke-opacity="0.25"/>
  <circle cx="52" cy="392" r="12" fill="#1F9E82"/>
  <text x="52" y="396" text-anchor="middle" fill="#10161D" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600">5</text>
  <text x="72" y="398" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">OPERATE IN PRODUCTION</text>
  <text x="36" y="428" fill="#F5F3ED" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600">Keep Telstra orders available after the cutover</text>

  <rect x="36" y="444" width="210" height="44" rx="2" fill="#1B242F" stroke="#8A96AC" stroke-opacity="0.3"/>
  <text x="141" y="462" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Elastic on K8s (ECK)</text>
  <text x="141" y="478" text-anchor="middle" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">−20% AWS managed cost</text>

  <rect x="256" y="444" width="210" height="44" rx="2" fill="#1B242F" stroke="#8A96AC" stroke-opacity="0.3"/>
  <text x="361" y="462" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Veracode + image scan</text>
  <text x="361" y="478" text-anchor="middle" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">−80% vulnerabilities</text>

  <rect x="476" y="444" width="210" height="44" rx="2" fill="#1B242F" stroke="#8A96AC" stroke-opacity="0.3"/>
  <text x="581" y="462" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">SVT + backend tuning</text>
  <text x="581" y="478" text-anchor="middle" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">+30% application speed</text>

  <rect x="696" y="444" width="220" height="44" rx="2" fill="#1B242F" stroke="#8A96AC" stroke-opacity="0.3"/>
  <text x="806" y="462" text-anchor="middle" fill="#F5F3ED" font-family="IBM Plex Mono, monospace" font-size="11">Splunk · Dynatrace · New Relic</text>
  <text x="806" y="478" text-anchor="middle" fill="#8A96AC" font-family="IBM Plex Mono, monospace" font-size="10">UAT + prod · Australia &amp; Mexico</text>
</svg>
